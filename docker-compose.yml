services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: react-initial:latest
    container_name: react-initial-app
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.react-app.rule=Host(`${APP_DOMAIN:-yourdomain.com}`)"
      - "traefik.http.routers.react-app.entrypoints=websecure"
      - "traefik.http.routers.react-app.tls=true"
      - "traefik.http.routers.react-app.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.react-app.loadbalancer.server.port=80"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
